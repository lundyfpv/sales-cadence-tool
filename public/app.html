<!doctype html>
<html lang="en">
<head>
<title>Sales Cadence Tool</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="top"><div class="top-in gut">
  <a class="brand" href="/"><img src="/icons/icon-192.png?v=3" alt=""><h1>Sales Cadence Tool</h1></a>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <select class="inp viewas" id="viewas" hidden aria-label="Whose customers and calendar to show"></select>
  <span class="sync" id="sync">Connecting…</span>
  <div class="menu">
    <button class="menu-btn bell" id="bell" aria-haspopup="true" aria-expanded="false" aria-label="Notifications"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6.5a4 4 0 0 1 8 0c0 3.2 1.3 4.5 1.3 4.5H2.7S4 9.7 4 6.5Z"/><path d="M6.6 13.2a1.5 1.5 0 0 0 2.8 0"/></svg><span class="badge" id="bell-n" hidden></span></button>
    <div class="menu-pop tray" id="tray" hidden></div>
  </div>
  <div class="menu">
    <button class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.8-2.6 3-4 5.5-4s4.7 1.4 5.5 4"/></svg></button>
    <div class="menu-pop" id="menu-pop" hidden>
      <div class="who" id="menu-who"></div>
      <div class="menu-label">Theme</div>
      <div id="menu-themes" role="group" aria-label="Theme"></div>
      <hr class="menu-sep">
      <button id="menu-install">Install app</button>
      <a href="/admin" id="menu-admin">Account &amp; team</a>
      <button id="menu-out">Sign out</button>
    </div>
  </div>
</div></div>
<div id="banner" class="banner gut" hidden></div>
<main class="gut" id="main"></main>
<div id="dlgs"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="/xlsx-lite.js"></script>
<script src="/app.js"></script>
</body>
</html>
