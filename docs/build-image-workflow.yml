# Optional: builds a Docker image on GitHub and publishes it to GitHub Container Registry
# (ghcr.io/<you>/sales-cadence-tool). To use it, move this file to
# .github/workflows/build.yml and push. Then TrueNAS can pull the image instead of building.
name: Build image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
